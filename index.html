    <audio id="musica" loop autoplay>
      <source src="Marcha-Nupcial.mp3" type="audio/mpeg" />

      <div class="content">
        <h1>¡Nos Casamos!</h1>

        <p class="text">Con la bendición de Dios</p>

        <div class="names">
          Yovani<br />
          & <br />
          Beatriz
        </div>

        <div class="divider"></div>

        <div class="date">7 de junio</div>

        <p class="text">Te invitamos a compartir este día tan especial</p>

        <div class="rsvp">
          <p><b>Confirma tu asistencia</b></p>

          <div class="btn-container">
            <button onclick="confirmar('si')" class="yes">
              💖 Sí asistiré
            </button>
            <button onclick="confirmar('no')" class="no">
              😢 No podré asistir
            </button>
          </div>

          <div class="result" id="respuesta"></div>

          <button class="whatsapp" id="btnWhatsapp" onclick="enviarWhatsApp()">
            Confirmar por WhatsApp
          </button>

          <div class="phone">📞 301 728 4953</div>
        </div>
      </div>
    </div>

    <script>
      const audio = document.getElementById("musica");
      audio.volume = 0.7;
      let reproduciendo = false;

      function iniciarMusica() {
        if (reproduciendo) return;
        audio.play().then(() => {
          reproduciendo = true;
          document.removeEventListener("click", iniciarMusica);
          document.removeEventListener("touchstart", iniciarMusica);
        }).catch(() => {});
      }

      // Intentar reproducir al cargar la página
      iniciarMusica();

      // Fallback por si el navegador bloquea el autoplay
      document.addEventListener("click", iniciarMusica);
      document.addEventListener("touchstart", iniciarMusica);

      let respuestaUsuario = "";

      function confirmar(respuesta) {
        respuestaUsuario = respuesta;

        document.getElementById("respuesta").innerText =
          respuesta === "si"
            ? "¡Nos encantará verte! 💛"
            : "Lamentamos que no puedas asistir 😢";

        document.getElementById("btnWhatsapp").style.display = "inline-block";
      }

      function enviarWhatsApp() {
        let mensaje =
          respuestaUsuario === "si"
            ? "Hola, confirmo que asistiré a la boda 💍"
            : "Hola, no podré asistir a la boda 😔";

        let url = `https://wa.me/573017284953?text=${encodeURIComponent(mensaje)}`;
        window.open(url, "_blank");
      }
    </script>
